name: Build Between Us APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Version Tag
        id: versioning
        run: |
          # Increment .1 to .10 then advance major version (1.1 -> 1.10 -> 2.1)
          RUN_NUM=${{ github.run_number }}
          INDEX=$((RUN_NUM - 1))
          MAJOR=$(( (INDEX / 10) + 1 ))
          MINOR=$(( (INDEX % 10) + 1 ))
          VERSION="v${MAJOR}.${MINOR}"
          echo "Calculated Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_clean=${MAJOR}.${MINOR}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Attempting to decode debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating debug.keystore using keytool..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Debug keystore ready:"
          ls -lh debug.keystore

      - name: Create Mock google-services.json if missing
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Creating fallback google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "between-us-couple",
              "storage_bucket": "between-us-couple.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.betweenus.kzjmvr"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_key_for_build"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate & Rename APK
        run: |
          mkdir -p build-artifacts
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          VERSION_TAG="${{ steps.versioning.outputs.version }}"
          if [ -f "$APK_PATH" ]; then
            echo "Found APK at $APK_PATH"
            cp "$APK_PATH" "build-artifacts/BetweenUs-${VERSION_TAG}.apk"
            cp "$APK_PATH" "build-artifacts/BetweenUs-latest.apk"
            ls -lh build-artifacts/
          else
            echo "Error: APK not found!"
            exit 1
          fi

      - name: Upload Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetweenUs-${{ steps.versioning.outputs.version }}
          path: build-artifacts/BetweenUs-${{ steps.versioning.outputs.version }}.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version }}
          name: "Between Us ${{ steps.versioning.outputs.version }}"
          body: |
            ### 🏡 Between Us (${{ steps.versioning.outputs.version }})
            
            Fresh build for Kola & Joy's cozy long-distance room! ✨
            
            #### 📥 Direct Phone Download:
            Download and open **`BetweenUs-${{ steps.versioning.outputs.version }}.apk`** attached below on your Android phone to install or update the app.
          files: |
            build-artifacts/BetweenUs-${{ steps.versioning.outputs.version }}.apk
            build-artifacts/BetweenUs-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
